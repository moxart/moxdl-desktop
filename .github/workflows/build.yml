# Installers for Linux, Windows and macOS, each with mox built in for that system.
#
# Run by hand (Actions → build → Run workflow) for files to try, kept as the run's artifacts.
# Pushing a tag like v0.3.0 also puts them in a pre-release of that name.
name: build

on:
  workflow_dispatch:
    inputs:
      mox_ref:
        description: The mox branch or tag to build in
        default: main
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # the oldest glibc still built on, so the .deb and AppImage run widely
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest # Apple silicon
            bundles: dmg
          - os: macos-13 # Intel
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moxart/moxdl
          ref: ${{ inputs.mox_ref || 'main' }}
          path: moxdl
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Libraries Tauri needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: mox, built into one executable
        shell: bash
        env:
          PYTHON: python
        run: scripts/build-engine.sh moxdl/mox.py
      - name: Installers
        shell: bash
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: mox-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Pre-release with every installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd files
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Mox desktop ${GITHUB_REF_NAME#v} (test version)" --generate-notes ./*

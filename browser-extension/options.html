<!doctype html>
<!-- The extension's options: whether it takes over downloads, and whether it may send the
     browser's cookies along, which it asks the browser for only when switched on here. -->
<html>
<head>
<meta charset="utf-8">
<title>Download with Mox</title>
<style>
  :root { color-scheme: light dark; --accent: #c42e3b; --muted: #6b5f62; --line: #e3d9d6; }
  @media (prefers-color-scheme: dark) { :root { --accent: #e54852; --muted: #a59c9e; --line: #352c2f; } }
  body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Vazirmatn, Tahoma, sans-serif; margin: 0; padding: 16px 18px; min-width: 340px; }
  h1 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 22px; height: 22px; }
  .status { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .status.ok { color: #2e7a45; } @media (prefers-color-scheme: dark) { .status.ok { color: #7dbe8a; } }
  label { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
  input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
  .about { display: block; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
  <h1><img src="icons/icon-48.png" alt=""><span id="title"></span></h1>
  <p class="status" id="status"></p>
  <label><input type="checkbox" id="catch"><span><span id="catch-label"></span><span class="about" id="catch-about"></span></span></label>
  <label><input type="checkbox" id="cookies"><span><span id="cookies-label"></span><span class="about" id="cookies-about"></span></span></label>
  <script src="options.js"></script>
</body>
</html>
